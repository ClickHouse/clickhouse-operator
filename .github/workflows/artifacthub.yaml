name: Publish Artifact Hub metadata
on:
  push:
    branches:
      - main
    paths:
      - .artifacthub/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-metadata:
    if: github.repository == 'ClickHouse/clickhouse-operator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Log in registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Artifact Hub reads repository metadata from the artifacthub.io tag next to each OCI chart.
      - name: Push metadata
        run: |
          for dir in .artifacthub/*/; do
            chart=$(basename "$dir")
            (cd "$dir" && oras push "ghcr.io/clickhouse/$chart:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml)
          done
