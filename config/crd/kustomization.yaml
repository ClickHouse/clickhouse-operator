# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/clickhouse.com_keeperclusters.yaml
- bases/clickhouse.com_clickhouseclusters.yaml
# +kubebuilder:scaffold:crdkustomizeresource

patches:
- path: patches/v1alpha2_podtemplate_containers_optional.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: clickhouseclusters.clickhouse.com
- path: patches/v1alpha2_keeper_podtemplate_containers_optional.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: keeperclusters.clickhouse.com
# +kubebuilder:scaffold:crdkustomizewebhookpatch
