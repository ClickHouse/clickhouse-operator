---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: clickhousescheduledbackups.clickhouse.com
spec:
  group: clickhouse.com
  names:
    kind: ClickHouseScheduledBackup
    listKind: ClickHouseScheduledBackupList
    plural: clickhousescheduledbackups
    shortNames:
    - chscheduledbackup
    singular: clickhousescheduledbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.template.spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.lastScheduleTime
      name: LastSchedule
      type: date
    - jsonPath: .status.lastSuccessfulTime
      name: LastSuccessful
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClickHouseScheduledBackup is the Schema for the `clickhousescheduledbackups` API.
          It creates ClickHouseBackup resources on a schedule.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClickHouseScheduledBackupSpec defines the desired state of
              ClickHouseScheduledBackup.
            properties:
              failedBackupsHistoryLimit:
                default: 3
                description: FailedBackupsHistoryLimit is the number of failed ClickHouseBackup
                  resources to keep.
                format: int32
                minimum: 0
                type: integer
              fullBackupInterval:
                description: |-
                  FullBackupInterval makes the schedule take incremental backups: every full backup is followed by
                  `fullBackupInterval - 1` incremental backups based on it.
                  When unset or 1, every backup is a full backup.
                format: int32
                minimum: 1
                type: integer
              schedule:
                description: Schedule in the cron format, see https://en.wikipedia.org/wiki/Cron.
                minLength: 1
                type: string
              successfulBackupsHistoryLimit:
                default: 10
                description: |-
                  SuccessfulBackupsHistoryLimit is the number of completed ClickHouseBackup resources to keep.
                  The most recent full backup and the base backups of the kept incremental backups are always kept.
                  Deleting a ClickHouseBackup resource does not delete the backup data from the storage.
                format: int32
                minimum: 1
                type: integer
              suspend:
                description: Suspend stops the creation of new backups. Backups that
                  are already running are not affected.
                type: boolean
              template:
                description: Template describes the backups created by the schedule.
                properties:
                  spec:
                    description: Spec of the created backups. `baseBackupRef` is managed
                      by the schedule and must not be set.
                    properties:
                      baseBackupRef:
                        description: |-
                          BaseBackupRef makes the backup incremental: only the data that is missing from the referenced
                          ClickHouseBackup is stored. The base backup must be completed and must stay in the storage
                          for as long as this backup is needed.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      clusterRef:
                        description: ClusterRef references the ClickHouseCluster to
                          back up. The cluster must be in the namespace of the backup.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      scope:
                        description: |-
                          Scope limits the backup to the listed databases and tables.
                          When omitted, everything except the `system` database is backed up.
                        properties:
                          databases:
                            description: Databases lists the databases to include.
                            items:
                              minLength: 1
                              type: string
                            maxItems: 256
                            type: array
                            x-kubernetes-list-type: set
                          tables:
                            description: Tables lists the individual tables to include.
                            items:
                              description: BackupTable identifies a table.
                              properties:
                                database:
                                  description: Database is the name of the database
                                    that holds the table.
                                  minLength: 1
                                  type: string
                                table:
                                  description: Table is the name of the table.
                                  minLength: 1
                                  type: string
                              required:
                              - database
                              - table
                              type: object
                            maxItems: 1024
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      settings:
                        additionalProperties:
                          type: string
                        description: Settings are additional settings passed to the
                          BACKUP statement.
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
                        - message: setting names must be valid identifiers
                          rule: self.all(k, k.matches('^[A-Za-z_][A-Za-z0-9_]*$'))
                      storage:
                        description: |-
                          Storage is the storage the backup is written to.
                          The backup is stored in the directory named after this resource.
                        properties:
                          s3:
                            description: S3 stores backups in an S3-compatible object
                              storage.
                            properties:
                              credentials:
                                description: |-
                                  Credentials used to access the storage.
                                  When omitted, ClickHouse uses the credentials available to the server itself,
                                  such as an IAM role attached to the Pod or the node.
                                properties:
                                  accessKeyID:
                                    description: AccessKeyID selects the Secret key
                                      that holds the access key ID.
                                    properties:
                                      key:
                                        description: The key of the secret to select
                                          from.  Must be a valid secret key.
                                        type: string
                                      name:
                                        description: The name of the secret in the
                                          cluster's namespace to select from.
                                        type: string
                                    required:
                                    - key
                                    - name
                                    type: object
                                  secretAccessKey:
                                    description: SecretAccessKey selects the Secret
                                      key that holds the secret access key.
                                    properties:
                                      key:
                                        description: The key of the secret to select
                                          from.  Must be a valid secret key.
                                        type: string
                                      name:
                                        description: The name of the secret in the
                                          cluster's namespace to select from.
                                        type: string
                                    required:
                                    - key
                                    - name
                                    type: object
                                required:
                                - accessKeyID
                                - secretAccessKey
                                type: object
                              endpoint:
                                description: |-
                                  Endpoint is the URL of the bucket and the prefix that holds backups, for example
                                  `https://my-bucket.s3.eu-west-1.amazonaws.com/clickhouse/my-cluster`.
                                  Every backup is written to its own directory under this URL.
                                maxLength: 2048
                                pattern: ^https?://[^\s'\\]+$
                                type: string
                            required:
                            - endpoint
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: s3 storage must be set
                          rule: has(self.s3)
                    required:
                    - clusterRef
                    - storage
                    type: object
                    x-kubernetes-validations:
                    - message: baseBackupRef is managed by the schedule
                      rule: '!has(self.baseBackupRef)'
                    - message: settings id, async and base_backup are managed by the
                        operator
                      rule: '!has(self.settings) || self.settings.all(k, !(k in [''id'',
                        ''async'', ''base_backup'']))'
                required:
                - spec
                type: object
              timeZone:
                description: TimeZone is the IANA time zone name the schedule is evaluated
                  in. Defaults to UTC.
                type: string
            required:
            - schedule
            - template
            type: object
          status:
            description: ClickHouseScheduledBackupStatus defines the observed state
              of ClickHouseScheduledBackup.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastBackupName:
                description: LastBackupName is the name of the most recent ClickHouseBackup
                  created by the schedule.
                type: string
              lastScheduleTime:
                description: LastScheduleTime is the schedule time of the most recent
                  backup created by the schedule.
                format: date-time
                type: string
              lastSuccessfulBackupName:
                description: LastSuccessfulBackupName is the name of the most recent
                  successful ClickHouseBackup.
                type: string
              lastSuccessfulTime:
                description: LastSuccessfulTime is the completion time of the most
                  recent successful backup.
                format: date-time
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: spec is required
          rule: has(self.spec)
        - message: name must be no more than 48 characters
          rule: self.metadata.name.size() <= 48
    served: true
    storage: true
    subresources:
      status: {}
