version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - funcorder
    - asciicheck
    - bidichk
    - contextcheck
    - copyloopvar
    - godot
    - gosec
    - nolintlint
    - errname
    - errorlint
    - nilerr
    - nilnesserr
    - asasalint
    - canonicalheader
    - goprintffuncname
    - gocritic
    - bodyclose
    - clickhouselint
    - exhaustive
    - usestdlibvars
    - wastedassign
    - reassign
    - thelper
    - containedctx
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - godoclint
    - godox
    - gomoddirectives
    - gosmopolitan
    - grouper
    - iface
    - importas
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - mnd
    - modernize
    - musttag
    - noctx
    - nosprintfhostport
    - perfsprint
    - promlinter
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tagalign
    - unqueryvet
    - usetesting
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    revive:
      enable-all-rules: true
      rules:
        - name: exported
          severity: warning
          disabled: false
          arguments:
            - "disable-checks-on-constants"
        - name: dot-imports
          severity: warning
          disabled: false
          exclude: [ "" ]
          arguments:
            - allowed-packages:
              - "github.com/onsi/ginkgo/v2"
              - "github.com/onsi/gomega"
        - name: package-comments
          disabled: true
        - name: struct-tag
          arguments: [ "json,inline" ]
        - { name: add-constant, disabled: true }
        - { name: cognitive-complexity, disabled: true }
        - { name: cyclomatic, disabled: true }
        - { name: deep-exit, disabled: true }
        - { name: enforce-switch-style, disabled: true }
        - { name: flag-parameter, disabled: true }
        - { name: function-length, disabled: true }
        - { name: line-length-limit, disabled: true }
        - { name: max-public-structs, disabled: true }
        - { name: multiline-if-init, disabled: true }
        - { name: nested-structs, disabled: true }
        - { name: unchecked-type-assertion, disabled: true }
        - { name: unhandled-error, disabled: true }
        - { name: unused-receiver, disabled: true }
    staticcheck:
      checks: [ "all", "-ST1000" ]
      dot-import-whitelist:
        - "github.com/onsi/ginkgo/v2"
        - "github.com/onsi/gomega"
    gosec:
      excludes:
        - G204
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - generic
        - Option$
        - github.com\/ClickHouse\/clickhouse-go/v2\.Conn
        - github.com\/ClickHouse\/clickhouse-go\/v2\/lib\/driver\.Rows
        - k8s.io
    wsl_v5:
      allow-whole-block: true
      branch-max-lines: 4
      case-max-lines: 4
    mnd:
      ignored-numbers: [ '2' ]
      ignored-files:
        - test/.*\.go
        - internal/controller/testutil/.*\.go
    goconst:
      ignore-tests: true
      ignore-string-values:
        - \S+\s+\S*
    wrapcheck:
      extra-ignore-sigs:
        - k8s.io/apimachinery/pkg/api/errors.New
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gocritic:
      enabled-tags: [ diagnostic ]
      enabled-checks: [ octalLiteral ]
      disabled-checks: [ sprintfQuotedString ]
    usetesting:
      context-background: true
      context-todo: true
      os-temp-dir: true
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    nolintlint:
      require-specific: true
    unparam:
      check-exported: true
    loggercheck:
      require-string-key: true
      no-printf-like: true
      rules:
        - (github.com/ClickHouse/clickhouse-operator/internal/controllerutil.Logger).With
        - (github.com/ClickHouse/clickhouse-operator/internal/controllerutil.Logger).Debug
        - (github.com/ClickHouse/clickhouse-operator/internal/controllerutil.Logger).Info
        - (github.com/ClickHouse/clickhouse-operator/internal/controllerutil.Logger).Warn
        - (github.com/ClickHouse/clickhouse-operator/internal/controllerutil.Logger).Error
        - (github.com/ClickHouse/clickhouse-operator/internal/controllerutil.Logger).Fatal
        - (github.com/ClickHouse/clickhouse-operator/internal/controllerutil.Logger).Panic
    nakedret:
      max-func-lines: 0
    iface:
      enable: [ identical, unusedmethod ]
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Put imports beginning with prefix after 3rd-party packages.
      local-prefixes:
       - github.com/ClickHouse/clickhouse-operator
    gofmt:
      simplify: true
      rewrite-rules:
        -   pattern: 'interface{}'
            replacement: 'any'
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
